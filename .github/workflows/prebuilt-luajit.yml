# Prebuilt LuaJIT static libraries.
#
# Why this workflow lives here and not in the engine repo: the prebuilt .a / .lib
# files are part of THIS haxelib, and hmm.json pulls it straight from
# https://github.com/mohong2/linc_luajit-rewriten - the engine never sees them.
#
# What runs when
#   push / pull_request : only the gate. It is strict: any <lib> selection in
#                         project/Build.xml that has no file AND is not listed in
#                         project/known-missing-libs.txt fails the job, and an
#                         allowlist entry whose file now exists fails too (so the
#                         list cannot rot). It also re-reads every committed
#                         prebuilt with tools/lib_arch.py, because an archive built
#                         for the wrong CPU links often enough to be shipped and
#                         only faults once it is on a device.
#   workflow_dispatch   : the gate plus the real builds. Kept manual on purpose:
#                         cross-building LuaJIT is toolchain-sensitive and must not
#                         turn every push red while it is being tuned.
#
# Every build job drives the same entry point, tools/build_luajit.sh (or its MSVC
# sibling on Windows), which writes straight to the path Build.xml links and then
# refuses to report success unless the artifact really carries the target CPU.
#
# The only selection that is neither present nor buildable here is
#   project/luajit/lib/Linux/libluajit-armv7.a
# The file ships, so the gate is happy, but the dispatch matrix cannot rebuild it -
# see the note in build-posix. Everything else in Build.xml is either reproducible
# below or allowlisted in project/known-missing-libs.txt with a reason.

name: Prebuilt LuaJIT

on:
  push:
    paths:
      - "project/**"
      - "tools/**"
      - ".github/workflows/prebuilt-luajit.yml"
  pull_request:
    paths:
      - "project/**"
      - "tools/**"
      - ".github/workflows/prebuilt-luajit.yml"
  workflow_dispatch:
    inputs:
      libref:
        description: "LuaJIT git ref to build"
        required: false
        default: "97813fb924edf822455f91a5fbbdfdb349e5984f"
      android_api:
        description: "Android API level for the android-* targets"
        required: false
        default: "21"

permissions:
  contents: read

env:
  LUAJIT_REF: ${{ inputs.libref || '97813fb924edf822455f91a5fbbdfdb349e5984f' }}
  ANDROID_API: ${{ inputs.android_api || '21' }}
  NDK_VERSION: r21e

jobs:
  gate:
    name: Prebuilt library gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Every Build.xml selection must exist or be allowlisted
        run: python3 tools/check_prebuilt_libs.py

      - name: Every committed prebuilt must carry the CPU it claims
        run: bash tools/build_luajit.sh --check --allow-missing

      - name: Inventory
        if: always()
        run: python3 tools/check_prebuilt_libs.py --json --allow-missing

  build-posix:
    name: build ${{ matrix.target }}
    if: github.event_name == 'workflow_dispatch'
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # Only the toolchain a target actually needs is installed. Asking for all of
      # them in every job made apt give up with "held broken packages", which took
      # the whole matrix down before a single compile started.
      matrix:
        include:
          - target: linux-x64
            packages: ""
          - target: linux-x86
            packages: "gcc-multilib"
          - target: linux-arm64
            packages: "gcc-aarch64-linux-gnu"
          # linux-armv7 is deliberately absent. A 32-bit ARM target needs BOTH the
          # armhf cross toolchain and a 32-bit host compiler, and on Ubuntu those
          # cannot coexist: linux-libc-dev-armhf-cross declares a conflict against
          # gcc-multilib, and gcc-<ver>-multilib pulls gcc-multilib back in, so apt
          # always ends up removing it ("The following packages will be REMOVED:
          # gcc-multilib") no matter how the install is ordered or split. Without it
          # "gcc -m32" cannot find asm/errno.h, and dropping the 32-bit host compiler
          # is not an option either - buildvm stops with "pointer size mismatch in
          # cross-build. Try: make HOST_CC=gcc -m32 CROSS=...". Building this target
          # needs a container or an out-of-apt toolchain; for now the shipped
          # project/luajit/lib/Linux/libluajit-armv7.a is kept as-is and the gate is
          # satisfied by its presence. Everything else in this matrix is reproducible.
          - target: mingw-x64
            packages: "gcc-mingw-w64-x86-64"
          - target: mingw-x86
            packages: "gcc-multilib gcc-mingw-w64-i686"
          - target: android-arm64
            packages: ""
          - target: android-armv7
            packages: "gcc-multilib"
          - target: android-x86
            packages: "gcc-multilib"
          - target: android-x86_64
            packages: ""
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchains this target needs
        run: |
          set -ux
          sudo apt-get update -qq
          for pkg in ${{ matrix.packages }}; do
            # One at a time: apt reports which package is unsatisfiable, and a
            # sequential install usually resolves what a combined one will not.
            # Recommends stay on: gcc-<ver>-<triple> only *recommends*
            # libc6-dev-<arch>-cross, and without it the cross compiler silently
            # falls back to the host's /usr/include and dies on
            # bits/libc-header-start.h.
            sudo apt-get install -y "$pkg"
          done

      - name: Install Android NDK ${{ env.NDK_VERSION }}
        if: startsWith(matrix.target, 'android-')
        run: |
          curl -sSLo ndk.zip "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux-x86_64.zip"
          unzip -q ndk.zip -d "$HOME"
          echo "ANDROID_NDK_ROOT=$HOME/android-ndk-${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Build and verify
        run: bash tools/build_luajit.sh ${{ matrix.target }}

      - name: Inventory after build
        # json: right after building, an allowlisted file legitimately exists in this
        # workspace, which the text report would flag as a stale entry.
        run: python3 tools/check_prebuilt_libs.py --json --allow-missing

      - uses: actions/upload-artifact@v4
        with:
          name: luajit-${{ matrix.target }}
          path: |
            project/luajit/lib
            dist
          if-no-files-found: error
          retention-days: 30

  build-apple:
    name: build ${{ matrix.target }}
    if: github.event_name == 'workflow_dispatch'
    needs: gate
    runs-on: macos-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target:
          - macos-64
          - ios-arm64
          - ios-sim
    steps:
      - uses: actions/checkout@v4

      - name: Check the Apple SDKs are usable
        run: |
          xcode-select -p
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphonesimulator --show-sdk-path

      - name: Build and verify
        run: bash tools/build_luajit.sh ${{ matrix.target }}

      - name: Inventory after build
        # json: right after building, an allowlisted file legitimately exists in this
        # workspace, which the text report would flag as a stale entry.
        run: python3 tools/check_prebuilt_libs.py --json --allow-missing

      - uses: actions/upload-artifact@v4
        with:
          name: luajit-${{ matrix.target }}
          path: |
            project/luajit/lib
            dist
          if-no-files-found: error
          retention-days: 30

  build-msvc:
    name: build windows-${{ matrix.arch }}
    if: github.event_name == 'workflow_dispatch'
    needs: gate
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x64]
    steps:
      - uses: actions/checkout@v4

      # No vcvarsall call here: the batch file locates the toolset itself through
      # vswhere, so it works on whatever edition the runner happens to ship.
      - name: Build and verify
        shell: cmd
        run: tools\build_luajit_msvc.bat ${{ matrix.arch }}

      - name: Inventory after build
        run: python tools/check_prebuilt_libs.py --allow-missing

      # The shell driver writes dist/<target>.txt for the collect job; the MSVC path
      # is a batch file, so the manifest is written here instead.
      - name: Write the manifest the collect job reads
        shell: bash
        run: |
          set -euo pipefail
          arch="${{ matrix.arch }}"
          if [ "$arch" = "x86" ]; then
            file="lua51-x86.lib"; bits="x86"
          else
            file="lua51-x86_64.lib"; bits="x86_64"
          fi
          mkdir -p dist
          printf 'target=windows-%s\nfile=project/luajit/lib/Windows/%s\narch=%s\n' \
            "$arch" "$file" "$bits" > "dist/windows-$arch.txt"
          cat "dist/windows-$arch.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: luajit-windows-${{ matrix.arch }}
          path: |
            project/luajit/lib
            dist
          if-no-files-found: error
          retention-days: 30

  collect:
    name: Collect prebuilts
    if: github.event_name == 'workflow_dispatch'
    needs: [build-posix, build-apple, build-msvc]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: incoming

      - name: Merge each target's own archive
        run: |
          set -euo pipefail
          # Copying whole project/luajit/lib trees made the last artifact win for every
          # single file, so a freshly built archive was silently overwritten by a stale
          # copy that an unrelated job happened to carry along. Each job ships a
          # manifest naming the one file it built and the hash it produced, so copy
          # exactly that file and then prove the copy still matches.
          merged=0
          for m in incoming/*/dist/*.txt; do
            [ -f "$m" ] || continue
            target="$(basename "$m" .txt)"
            rel="$(sed -n 's|^file=||p' "$m" | head -n1)"
            want="$(sed -n 's|^sha256=||p' "$m" | head -n1)"
            if [ -z "$rel" ]; then
              echo "::error::$target: manifest has no file= line"
              exit 1
            fi
            src="$(dirname "$m")/../$rel"
            if [ ! -f "$src" ]; then
              echo "::error::$target: the artifact does not contain $rel"
              exit 1
            fi
            mkdir -p "$(dirname "$rel")"
            cp "$src" "$rel"
            if [ -n "$want" ]; then
              got="$(sha256sum "$rel" | cut -d' ' -f1)"
              if [ "$got" != "$want" ]; then
                echo "::error::$target: $rel hashes $got but the build recorded $want"
                exit 1
              fi
            fi
            echo "merged $target -> $rel"
            merged=$((merged + 1))
          done
          if [ "$merged" -eq 0 ]; then
            echo "::error::no target manifests found under incoming/"
            exit 1
          fi
          mkdir -p dist
          cp incoming/*/dist/*.txt dist/ 2>/dev/null || true
          echo "$merged archives merged"
          ls -lR project/luajit/lib | head -n 60

      # Prunes any allowlist entry the build just satisfied, then checks. Without
      # this the stale-entry rule would fail the one job that fixed the gap.
      - name: The allowlist gate must be green
        run: python3 tools/check_prebuilt_libs.py --prune-allowlist

      - name: Every collected prebuilt must carry the CPU it claims
        run: bash tools/build_luajit.sh --check --allow-missing

      - name: What to commit
        run: |
          echo "Copy these files back into the haxelib and commit:"
          git status --short project/luajit/lib

      - uses: actions/upload-artifact@v4
        with:
          name: luajit-prebuilts
          path: |
            project/luajit/lib
            project/known-missing-libs.txt
            dist
          if-no-files-found: error
          retention-days: 30
